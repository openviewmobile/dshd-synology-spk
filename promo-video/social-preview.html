<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}html,body{width:1280px;height:640px;overflow:hidden;background:#05070d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#f4f7fb}
.stage{position:relative;width:1280px;height:640px;overflow:hidden;background:radial-gradient(700px 460px at 76% 15%,rgba(37,99,235,.28),transparent 62%),radial-gradient(600px 400px at 12% 100%,rgba(124,58,237,.2),transparent 62%),linear-gradient(140deg,#04060b,#071421 55%,#05070d)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(103,232,249,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(103,232,249,.05) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(70% 70% at 55% 45%,#000,transparent)}
.ring{position:absolute;border:1px solid rgba(103,232,249,.13);border-radius:50%;transform:rotate(-15deg)}.r1{width:620px;height:230px;right:-110px;top:190px}.r2{width:470px;height:180px;right:-20px;top:220px;border-color:rgba(167,139,250,.15)}
.copy{position:absolute;left:64px;top:94px;z-index:2;width:760px}
.eyebrow{font-family:"SF Mono",Menlo,monospace;font-size:14px;letter-spacing:.2em;color:#67e8f9;text-transform:uppercase;display:flex;gap:10px;align-items:center}.eyebrow:before{content:"";width:28px;height:1px;background:#67e8f9}
h1{font-size:82px;line-height:.92;letter-spacing:-.055em;margin-top:20px;font-weight:800}.cyan{color:#a5f3fc}
.sub{font-size:23px;color:#b9c7da;margin-top:20px;line-height:1.35;max-width:690px}
.badges{display:flex;gap:9px;margin-top:24px}.b{font-family:"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.08em;padding:8px 11px;border-radius:999px;border:1px solid rgba(103,232,249,.4);color:#cffafe;background:rgba(8,47,73,.45)}.b.dim{border-color:rgba(148,163,184,.3);color:#d5dfec;background:rgba(15,23,42,.45)}
.icon{position:absolute;right:70px;top:78px;width:148px;height:148px;border-radius:34px;overflow:hidden;box-shadow:0 0 70px rgba(34,211,238,.28);z-index:3}.icon img{width:100%;height:100%;display:block}
.card{position:absolute;right:40px;bottom:40px;width:350px;border-radius:14px;overflow:hidden;border:1px solid rgba(148,163,184,.3);box-shadow:0 24px 60px rgba(0,0,0,.5);transform:rotate(-2deg);z-index:3}.card img{width:100%;display:block}
.footer{position:absolute;left:64px;bottom:40px;font-family:"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.1em;color:#9ba9bc;text-transform:uppercase}
</style></head><body><div class="stage"><div class="grid"></div><div class="ring r1"></div><div class="ring r2"></div>
<div class="copy"><div class="eyebrow">Native Synology package</div><h1>NO DOCKER.<br/><span class="cyan">AI AGENT ON<br/>YOUR NAS.</span></h1><div class="sub">DeepSeek Harness on DSM 7.2, with a bundled Node runtime and Package Center lifecycle.</div><div class="badges"><span class="b">DSM 7.2+</span><span class="b">x86_64 / armv8</span><span class="b dim">MIT · community SPK</span></div></div>
<div class="icon"><img src="assets/app-icon.png"/></div><div class="card"><img src="assets/package-center-branded.png"/></div><div class="footer">github.com · dshd-synology-spk</div></div></body></html>
