services:
  dshd:
    image: dshd-synology:latest
    container_name: dshd
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:3080"
    environment:
      DSH_PUBLIC_URL: "https://dsh.example.com"
      DSH_TRUSTED_HOST: "dsh.example.com"
    volumes:
      - /volume1/docker/dshd/home:/home/dsh
