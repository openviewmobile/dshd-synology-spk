name: Feature request
description: Suggest a package, documentation, or integration improvement
title: "[feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like. Note any DSM/architecture constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "DSM 7.2.2, x86_64, native 0.4.0"
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This request does not contain secrets or private data.
          required: true
        - label: I searched existing issues and discussions.
          required: true
