name: refresh SPK source index

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download release SPKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.4.0 --pattern '*.spk' --dir /tmp/spks --repo "${{ github.repository }}"
      - name: Regenerate source indexes
        run: python3 scripts/generate-spk-source.py --dir /tmp/spks --out docs/spk-repo --tag v0.4.0 --repo "${{ github.repository }}"
      - name: Open source-index PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/spk-repo; then
            echo "source indexes already current"
            exit 0
          fi
          branch="spk-source-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/spk-repo
          git commit -m "chore: refresh SPK source indexes with MD5"
          git push origin "$branch"
          gh pr create --repo "${{ github.repository }}" --base main --head "$branch" \
            --title "chore: refresh SPK source indexes with MD5" \
            --body "Generated by the refresh SPK source workflow from the official v0.4.0 release assets."
